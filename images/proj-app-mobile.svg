<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Aplicativo de ordem de serviço para técnico em campo, em dois celulares">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#061120"/>
    </linearGradient>
    <linearGradient id="ac4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
    <style>.t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
  </defs>
  <rect width="800" height="480" fill="url(#bg4)"/>
  <circle cx="640" cy="120" r="150" fill="#208bf4" opacity=".08"/>

  <!-- secondary phone: map -->
  <g transform="translate(494,86)">
    <rect x="0" y="0" width="212" height="330" rx="26" fill="#0d1c2e" stroke="#31567c" stroke-width="3"/>
    <rect x="10" y="10" width="192" height="310" rx="18" fill="#e8eff5"/>
    <!-- map -->
    <rect x="10" y="10" width="192" height="228" fill="#dbe7f0"/>
    <g stroke="#c2d4e2" stroke-width="8" fill="none">
      <path d="M10 92h192M10 176h192M74 10v228M148 10v228"/>
    </g>
    <path d="M40 238 74 92l74 30 40-60" stroke="#1f6fd0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <path d="M108 92a20 20 0 1 0-40 0c0 15 20 34 20 34s20-19 20-34z" fill="#e04f4f"/>
      <circle cx="88" cy="92" r="7" fill="#ffffff"/>
    </g>
    <circle cx="40" cy="238" r="9" fill="#1f6fd0" stroke="#ffffff" stroke-width="3"/>
    <!-- card -->
    <rect x="24" y="252" width="164" height="54" rx="12" fill="#ffffff"/>
    <text class="t" x="40" y="274" fill="#12263c" font-size="15" font-weight="700">Av. Epitácio, 1120</text>
    <text class="t" x="40" y="294" fill="#7c93a7" font-size="13">Chegada prevista 14:20</text>
  </g>

  <!-- main phone -->
  <g transform="translate(214,40)">
    <rect x="0" y="0" width="256" height="400" rx="32" fill="#0d1c2e" stroke="#31567c" stroke-width="3"/>
    <rect x="11" y="11" width="234" height="378" rx="22" fill="#f5f8fb"/>
    <rect x="11" y="11" width="234" height="72" rx="22" fill="#12324f"/>
    <rect x="11" y="60" width="234" height="23" fill="#12324f"/>
    <path d="M32 40l-10 8 10 8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="48" y="46" fill="#ffffff" font-size="17" font-weight="700">OS #1204</text>
    <text class="t" x="48" y="68" fill="#9dbdd8" font-size="13">Manutenção preventiva</text>

    <!-- offline badge -->
    <g>
      <rect x="152" y="98" width="84" height="26" rx="13" fill="#fff0d6"/>
      <circle cx="167" cy="111" r="5" fill="#b3781a"/>
      <text class="t" x="178" y="116" fill="#b3781a" font-size="13" font-weight="600">Offline</text>
    </g>
    <text class="t" x="24" y="116" fill="#12263c" font-size="16" font-weight="700">Checklist</text>

    <!-- checklist -->
    <g class="t" font-size="15">
      <rect x="22" y="134" width="212" height="46" rx="12" fill="#ffffff" stroke="#e1eaf3"/>
      <circle cx="46" cy="157" r="12" fill="#1f8f5f"/>
      <path d="M40 157l4 5 8-9" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="162" fill="#2b4157">Chegada registrada</text>

      <rect x="22" y="188" width="212" height="46" rx="12" fill="#ffffff" stroke="#e1eaf3"/>
      <circle cx="46" cy="211" r="12" fill="#1f8f5f"/>
      <path d="M40 211l4 5 8-9" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="216" fill="#2b4157">Fotos do equipamento</text>

      <rect x="22" y="242" width="212" height="46" rx="12" fill="#ffffff" stroke="#e1eaf3"/>
      <circle cx="46" cy="265" r="12" fill="none" stroke="#b7c8d7" stroke-width="3"/>
      <text x="68" y="270" fill="#7c93a7">Peças substituídas</text>
    </g>

    <!-- signature -->
    <rect x="22" y="298" width="212" height="52" rx="12" fill="#ffffff" stroke="#e1eaf3" stroke-dasharray="6 5"/>
    <path d="M48 334c16-22 24-22 34 0s18 14 30-8 20-12 30 2" fill="none" stroke="#12263c" stroke-width="3" stroke-linecap="round"/>
    <text class="t" x="128" y="316" fill="#9db0c1" font-size="12" text-anchor="middle">Assinatura do cliente</text>

    <rect x="22" y="358" width="212" height="20" rx="10" fill="url(#ac4)"/>
  </g>

  <!-- technician silhouette -->
  <g transform="translate(96,196)">
    <circle cx="46" cy="42" r="30" fill="#2f6ea8"/>
    <path d="M16 40a30 30 0 0 1 60 0z" fill="#ffd166"/>
    <path d="M8 40h76" stroke="#ffd166" stroke-width="7" stroke-linecap="round"/>
    <path d="M6 190v-84a40 40 0 0 1 40-40h0a40 40 0 0 1 40 40v84z" fill="#1f6fd0"/>
    <rect x="20" y="118" width="52" height="10" rx="5" fill="#0f2740" opacity=".5"/>
    <path d="M86 120l34-16" stroke="#1f6fd0" stroke-width="16" stroke-linecap="round"/>
    <rect x="112" y="86" width="26" height="34" rx="6" fill="#0d1c2e" transform="rotate(-14 125 103)"/>
  </g>
</svg>

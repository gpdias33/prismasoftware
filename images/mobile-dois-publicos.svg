<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-label="Dois aplicativos: um para o cliente final comprar e acompanhar pedidos, outro para a equipe em campo registrar visitas e checklists">
  <defs>
    <linearGradient id="mdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#050f1d"/>
    </linearGradient>
    <linearGradient id="mdac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
    <style>.t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
  </defs>

  <rect width="840" height="470" fill="url(#mdbg)"/>
  <circle cx="210" cy="120" r="180" fill="#208bf4" opacity=".06"/>
  <circle cx="640" cy="360" r="180" fill="#3ddc97" opacity=".045"/>

  <!-- ===== público 1: cliente ===== -->
  <text class="t" x="52" y="40" fill="#4aa8ff" font-size="12" font-weight="700" letter-spacing="1.6">PARA O SEU CLIENTE</text>

  <g transform="translate(52,62)">
    <rect x="0" y="0" width="188" height="360" rx="28" fill="#0d1c2e" stroke="#31567c" stroke-width="3"/>
    <rect x="10" y="10" width="168" height="340" rx="20" fill="#ffffff"/>
    <rect x="10" y="10" width="168" height="34" rx="20" fill="#0f2740"/>
    <rect x="10" y="28" width="168" height="16" fill="#0f2740"/>
    <rect x="72" y="18" width="44" height="7" rx="3.5" fill="#31567c"/>

    <!-- cabeçalho -->
    <circle cx="34" cy="66" r="12" fill="url(#mdac)"/>
    <text class="t" x="54" y="64" fill="#12263c" font-size="11" font-weight="700">Olá, Renata</text>
    <text class="t" x="54" y="77" fill="#8ba0b5" font-size="9">3 pedidos ativos</text>

    <!-- card de pedido -->
    <rect x="24" y="94" width="140" height="66" rx="10" fill="#eef4fa"/>
    <text class="t" x="36" y="114" fill="#12263c" font-size="10" font-weight="700">Pedido #4821</text>
    <rect x="36" y="124" width="116" height="6" rx="3" fill="#d2e0ec"/>
    <rect x="36" y="124" width="78" height="6" rx="3" fill="#4aa8ff"/>
    <text class="t" x="36" y="148" fill="#5a7a96" font-size="9">Saiu para entrega · chega hoje</text>

    <!-- atalhos -->
    <g>
      <rect x="24" y="174" width="66" height="60" rx="10" fill="#f4f8fc"/>
      <circle cx="57" cy="198" r="12" fill="#e2effc"/>
      <path d="M51 198h12M57 192v12" stroke="#1f6fd0" stroke-width="2.4" stroke-linecap="round"/>
      <text class="t" x="57" y="224" text-anchor="middle" fill="#5a7a96" font-size="8.5">Novo pedido</text>

      <rect x="98" y="174" width="66" height="60" rx="10" fill="#f4f8fc"/>
      <circle cx="131" cy="198" r="12" fill="#e2effc"/>
      <path d="M126 198l4 4 7-8" stroke="#1f6fd0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="t" x="131" y="224" text-anchor="middle" fill="#5a7a96" font-size="8.5">Histórico</text>
    </g>

    <!-- lista -->
    <g>
      <rect x="24" y="248" width="140" height="28" rx="8" fill="#f4f8fc"/>
      <rect x="34" y="259" width="70" height="6" rx="3" fill="#c3d5e4"/>
      <rect x="24" y="284" width="140" height="28" rx="8" fill="#f4f8fc"/>
      <rect x="34" y="295" width="88" height="6" rx="3" fill="#c3d5e4"/>
    </g>

    <!-- barra inferior -->
    <rect x="10" y="318" width="168" height="32" fill="#f7fafd"/>
    <g fill="#c3d5e4">
      <circle cx="52" cy="334" r="5"/><circle cx="94" cy="334" r="5"/><circle cx="136" cy="334" r="5"/>
    </g>
    <circle cx="52" cy="334" r="5" fill="#1f6fd0"/>
  </g>

  <g class="t" transform="translate(52,438)">
    <text x="0" y="0" fill="#8ea7c0" font-size="12">Compra, acompanha e volta — sem ligar para você.</text>
  </g>

  <!-- ===== público 2: equipe em campo ===== -->
  <text class="t" x="600" y="40" fill="#3ddc97" font-size="12" font-weight="700" letter-spacing="1.6">PARA A SUA EQUIPE</text>

  <g transform="translate(600,62)">
    <rect x="0" y="0" width="188" height="360" rx="28" fill="#0d1c2e" stroke="#31567c" stroke-width="3"/>
    <rect x="10" y="10" width="168" height="340" rx="20" fill="#0a1727"/>
    <rect x="10" y="10" width="168" height="34" rx="20" fill="#0f2a1f"/>
    <rect x="10" y="28" width="168" height="16" fill="#0f2a1f"/>
    <circle cx="28" cy="27" r="4" fill="#f5a623"/>
    <text class="t" x="40" y="31" fill="#f5c06a" font-size="8.5" font-weight="600">sem sinal · modo offline</text>

    <text class="t" x="24" y="66" fill="#ffffff" font-size="11" font-weight="700">Rota de hoje</text>
    <text class="t" x="24" y="80" fill="#7f9bbd" font-size="9">4 de 7 visitas concluídas</text>

    <!-- visitas -->
    <g>
      <rect x="24" y="94" width="140" height="40" rx="9" fill="#12233a"/>
      <circle cx="42" cy="114" r="9" fill="#3ddc97" opacity=".2"/>
      <path d="M38 114l3 3 6-7" stroke="#3ddc97" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="t" x="58" y="111" fill="#dfeaf5" font-size="9.5" font-weight="600">Metalúrgica Souza</text>
      <text class="t" x="58" y="124" fill="#6d89a8" font-size="8.5">concluída 09h12</text>

      <rect x="24" y="142" width="140" height="40" rx="9" fill="#12233a"/>
      <circle cx="42" cy="162" r="9" fill="#3ddc97" opacity=".2"/>
      <path d="M38 162l3 3 6-7" stroke="#3ddc97" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="t" x="58" y="159" fill="#dfeaf5" font-size="9.5" font-weight="600">Depósito Central</text>
      <text class="t" x="58" y="172" fill="#6d89a8" font-size="8.5">concluída 10h40</text>

      <rect x="24" y="190" width="140" height="56" rx="9" fill="#14304a" stroke="#3a6ea5" stroke-width="1.5"/>
      <circle cx="42" cy="210" r="9" fill="#4aa8ff" opacity=".22"/>
      <circle cx="42" cy="210" r="3.5" fill="#4aa8ff"/>
      <text class="t" x="58" y="207" fill="#ffffff" font-size="9.5" font-weight="700">Construtora Vega</text>
      <text class="t" x="58" y="220" fill="#8ea7c0" font-size="8.5">agora · 2,4 km</text>
      <rect x="34" y="228" width="120" height="12" rx="6" fill="#1f6fd0"/>
      <text class="t" x="94" y="237" text-anchor="middle" fill="#ffffff" font-size="7.5" font-weight="700">INICIAR CHECKLIST</text>
    </g>

    <!-- foto e assinatura -->
    <g>
      <rect x="24" y="256" width="66" height="50" rx="9" fill="#12233a"/>
      <rect x="36" y="272" width="42" height="26" rx="4" fill="none" stroke="#6d89a8" stroke-width="1.8"/>
      <circle cx="57" cy="285" r="7" fill="none" stroke="#6d89a8" stroke-width="1.8"/>
      <text class="t" x="57" y="268" text-anchor="middle" fill="#7f9bbd" font-size="8">foto</text>

      <rect x="98" y="256" width="66" height="50" rx="9" fill="#12233a"/>
      <path d="M110 288q8-14 14-2t14-8" stroke="#6d89a8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text class="t" x="131" y="268" text-anchor="middle" fill="#7f9bbd" font-size="8">assinatura</text>
    </g>

    <!-- fila de sincronização -->
    <rect x="24" y="316" width="140" height="26" rx="8" fill="#1f1a0d" stroke="#5c4a22"/>
    <circle cx="40" cy="329" r="5" fill="none" stroke="#f5c06a" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text class="t" x="54" y="333" fill="#f5c06a" font-size="8.5">3 registros aguardando sinal</text>
  </g>

  <g class="t" transform="translate(600,438)">
    <text x="0" y="0" fill="#8ea7c0" font-size="12">Trabalha sem internet e sincroniza sozinho depois.</text>
  </g>

  <!-- ===== ligação central ===== -->
  <g transform="translate(300,180)">
    <rect x="0" y="0" width="240" height="118" rx="14" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <text class="t" x="120" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Seus sistemas</text>
    <text class="t" x="120" y="50" text-anchor="middle" fill="#8ea7c0" font-size="11">ERP · estoque · agenda</text>
    <g transform="translate(88,64)">
      <ellipse cx="32" cy="8" rx="32" ry="8" fill="none" stroke="#4aa8ff" stroke-width="2"/>
      <path d="M0 8v24c0 4.4 14.3 8 32 8s32-3.6 32-8V8" fill="none" stroke="#4aa8ff" stroke-width="2"/>
    </g>
  </g>
  <g stroke="#2c4a6e" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <path d="M248 240h48"/>
    <path d="M544 240h48"/>
  </g>
</svg>

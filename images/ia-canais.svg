<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-label="Um mesmo agente de IA atendendo simultaneamente no WhatsApp, no Instagram, no site e por e-mail, com transbordo para um atendente humano">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#050f1d"/>
    </linearGradient>
    <style>.t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
  </defs>

  <rect width="840" height="400" fill="url(#cbg)"/>
  <circle cx="420" cy="196" r="230" fill="#208bf4" opacity=".05"/>

  <!-- linhas de conexão -->
  <g stroke="#2c4a6e" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <path d="M148 120q140 40 262 76"/>
    <path d="M148 286q140 -30 262 -84"/>
    <path d="M692 120q-140 40 -262 76"/>
    <path d="M692 286q-140 -30 -262 -84"/>
  </g>

  <!-- ===== centro: agente ===== -->
  <g transform="translate(348,148)">
    <circle cx="72" cy="52" r="86" fill="#4aa8ff" opacity=".07"/>
    <rect x="8" y="0" width="128" height="104" rx="18" fill="#122744" stroke="#3a6ea5" stroke-width="2"/>
    <circle cx="48" cy="44" r="9" fill="#4aa8ff"/>
    <circle cx="96" cy="44" r="9" fill="#4aa8ff"/>
    <path d="M46 70q26 16 52 0" stroke="#4aa8ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text class="t" x="72" y="132" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">um só agente</text>
    <text class="t" x="72" y="152" text-anchor="middle" fill="#8ea7c0" font-size="11">mesma resposta em todo canal</text>
  </g>

  <!-- ===== canal: WhatsApp ===== -->
  <g transform="translate(40,84)">
    <rect x="0" y="0" width="216" height="72" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <g transform="translate(20,20)">
      <circle cx="16" cy="16" r="16" fill="#25d366" opacity=".16"/>
      <path d="M16 6a10 10 0 0 0-8.6 15.1L6 26l5.1-1.3A10 10 0 1 0 16 6z" fill="none" stroke="#25d366" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text class="t" x="66" y="32" fill="#ffffff" font-size="13.5" font-weight="700">WhatsApp</text>
    <text class="t" x="66" y="52" fill="#8ea7c0" font-size="11">onde o cliente já está</text>
  </g>

  <!-- ===== canal: Instagram ===== -->
  <g transform="translate(40,250)">
    <rect x="0" y="0" width="216" height="72" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <g transform="translate(20,20)">
      <circle cx="16" cy="16" r="16" fill="#e1306c" opacity=".16"/>
      <rect x="7" y="7" width="18" height="18" rx="5.5" fill="none" stroke="#e1306c" stroke-width="2"/>
      <circle cx="16" cy="16" r="4.5" fill="none" stroke="#e1306c" stroke-width="2"/>
      <circle cx="21.5" cy="10.5" r="1.4" fill="#e1306c"/>
    </g>
    <text class="t" x="66" y="32" fill="#ffffff" font-size="13.5" font-weight="700">Instagram e Facebook</text>
    <text class="t" x="66" y="52" fill="#8ea7c0" font-size="11">direct e comentários</text>
  </g>

  <!-- ===== canal: site ===== -->
  <g transform="translate(584,84)">
    <rect x="0" y="0" width="216" height="72" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <g transform="translate(20,20)">
      <circle cx="16" cy="16" r="16" fill="#4aa8ff" opacity=".16"/>
      <rect x="6" y="8" width="20" height="16" rx="3" fill="none" stroke="#4aa8ff" stroke-width="2"/>
      <path d="M6 13h20" stroke="#4aa8ff" stroke-width="2"/>
    </g>
    <text class="t" x="66" y="32" fill="#ffffff" font-size="13.5" font-weight="700">Chat no seu site</text>
    <text class="t" x="66" y="52" fill="#8ea7c0" font-size="11">captura quem está pesquisando</text>
  </g>

  <!-- ===== canal: e-mail / telefone ===== -->
  <g transform="translate(584,250)">
    <rect x="0" y="0" width="216" height="72" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <g transform="translate(20,20)">
      <circle cx="16" cy="16" r="16" fill="#f5a623" opacity=".16"/>
      <rect x="6" y="9" width="20" height="14" rx="2.5" fill="none" stroke="#f5a623" stroke-width="2"/>
      <path d="M6 11l10 7 10-7" fill="none" stroke="#f5a623" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text class="t" x="66" y="32" fill="#ffffff" font-size="13.5" font-weight="700">E-mail e formulários</text>
    <text class="t" x="66" y="52" fill="#8ea7c0" font-size="11">triagem e resposta automática</text>
  </g>

  <!-- ===== transbordo ===== -->
  <g transform="translate(288,336)">
    <rect x="0" y="0" width="264" height="48" rx="12" fill="#0f2a1f" stroke="#1d5a3e" stroke-width="1.5"/>
    <g transform="translate(18,12)">
      <circle cx="10" cy="7" r="6" fill="none" stroke="#3ddc97" stroke-width="2"/>
      <path d="M0 24c0-6 4.5-10 10-10s10 4 10 10" fill="none" stroke="#3ddc97" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text class="t" x="56" y="21" fill="#ffffff" font-size="12" font-weight="700">Caso complexo?</text>
    <text class="t" x="56" y="37" fill="#9ee3c2" font-size="11">passa para o seu time, com o histórico junto</text>
  </g>
  <g stroke="#1d5a3e" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M420 300v30"/>
  </g>
</svg>

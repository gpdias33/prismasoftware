<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Linha de produção com esteira, braço robótico e painel de simulação apontando gargalo">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#061120"/>
    </linearGradient>
    <linearGradient id="ac6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
    <style>.t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
  </defs>
  <rect width="800" height="480" fill="url(#bg6)"/>

  <!-- factory shell: sawtooth roof + windows -->
  <path d="M40 150l52-52 52 52v-40l52-52 52 52v-40l52-52 52 52" fill="none" stroke="#2b4a6d" stroke-width="4"/>
  <g fill="#12324f" opacity=".55">
    <rect x="60" y="120" width="40" height="30" rx="4"/>
    <rect x="164" y="120" width="40" height="30" rx="4"/>
    <rect x="268" y="120" width="40" height="30" rx="4"/>
  </g>

  <!-- conveyor belt -->
  <rect x="52" y="322" width="600" height="30" rx="8" fill="#20364e"/>
  <rect x="52" y="322" width="600" height="10" rx="5" fill="#2f4f70"/>
  <g fill="#16273c">
    <circle cx="86" cy="368" r="20"/><circle cx="196" cy="368" r="20"/><circle cx="306" cy="368" r="20"/>
    <circle cx="416" cy="368" r="20"/><circle cx="526" cy="368" r="20"/><circle cx="628" cy="368" r="20"/>
  </g>
  <g fill="none" stroke="#3a5f86" stroke-width="4">
    <circle cx="86" cy="368" r="20"/><circle cx="196" cy="368" r="20"/><circle cx="306" cy="368" r="20"/>
    <circle cx="416" cy="368" r="20"/><circle cx="526" cy="368" r="20"/><circle cx="628" cy="368" r="20"/>
  </g>
  <g stroke="#3a5f86" stroke-width="3">
    <path d="M86 348v-16M196 348v-16M306 348v-16M416 348v-16M526 348v-16M628 348v-16"/>
  </g>

  <!-- boxes on the belt -->
  <g>
    <g transform="translate(96,270)">
      <rect width="56" height="52" rx="4" fill="#c98f4e"/>
      <path d="M0 16h56" stroke="#a9743a" stroke-width="4"/>
      <path d="M28 0v16" stroke="#a9743a" stroke-width="4"/>
    </g>
    <g transform="translate(226,270)">
      <rect width="56" height="52" rx="4" fill="#c98f4e"/>
      <path d="M0 16h56" stroke="#a9743a" stroke-width="4"/>
      <path d="M28 0v16" stroke="#a9743a" stroke-width="4"/>
    </g>
    <!-- queue piling at the bottleneck -->
    <g transform="translate(352,270)">
      <rect width="56" height="52" rx="4" fill="#c98f4e"/>
      <path d="M0 16h56" stroke="#a9743a" stroke-width="4"/><path d="M28 0v16" stroke="#a9743a" stroke-width="4"/>
    </g>
    <g transform="translate(412,270)">
      <rect width="56" height="52" rx="4" fill="#c98f4e"/>
      <path d="M0 16h56" stroke="#a9743a" stroke-width="4"/><path d="M28 0v16" stroke="#a9743a" stroke-width="4"/>
    </g>
    <g transform="translate(382,214)">
      <rect width="56" height="52" rx="4" fill="#b87f42"/>
      <path d="M0 16h56" stroke="#96662f" stroke-width="4"/><path d="M28 0v16" stroke="#96662f" stroke-width="4"/>
    </g>
  </g>

  <!-- machine / press at bottleneck -->
  <g>
    <rect x="330" y="140" width="164" height="66" rx="10" fill="#22405f" stroke="#ffb454" stroke-width="3"/>
    <rect x="352" y="160" width="120" height="10" rx="5" fill="#ffb454"/>
    <rect x="352" y="180" width="76" height="8" rx="4" fill="#ffd9a0" opacity=".5"/>
    <path d="M400 206v6" stroke="#ffb454" stroke-width="6"/>
    <!-- alert -->
    <g transform="translate(510,158)">
      <path d="M0-22 22 18H-22z" fill="#ffb454"/>
      <path d="M0-10v14M0 10v3" stroke="#0b1a2e" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text class="t" x="540" y="172" fill="#ffb454" font-size="17" font-weight="700">Gargalo</text>
  </g>

  <!-- robotic arm -->
  <g>
    <rect x="120" y="196" width="60" height="18" rx="6" fill="#2f4f70"/>
    <path d="M150 196v-46l64-40" stroke="#3a5f86" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="150" r="11" fill="#4aa8ff"/>
    <circle cx="214" cy="110" r="9" fill="#4aa8ff"/>
    <path d="M214 110l26 20" stroke="#3a5f86" stroke-width="11" stroke-linecap="round"/>
    <path d="M236 126l-8 16m8-16 16 6" stroke="#4aa8ff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- gears -->
  <g transform="translate(600,120)" fill="#2f4f70">
    <circle r="34" stroke="#3a5f86" stroke-width="4" fill="#20364e"/>
    <circle r="12" fill="#0b1a2e"/>
    <g>
      <rect x="-5" y="-46" width="10" height="14" rx="3"/><rect x="-5" y="32" width="10" height="14" rx="3"/>
      <rect x="-46" y="-5" width="14" height="10" rx="3"/><rect x="32" y="-5" width="14" height="10" rx="3"/>
      <rect x="-38" y="-38" width="12" height="10" rx="3" transform="rotate(45 -32 -33)"/>
      <rect x="26" y="26" width="12" height="10" rx="3" transform="rotate(45 32 31)"/>
    </g>
  </g>

  <!-- simulation panel -->
  <g transform="translate(486,238)">
    <rect x="0" y="0" width="278" height="184" rx="14" fill="#f4f8fc" stroke="#31567c" stroke-width="2"/>
    <rect x="0" y="0" width="278" height="38" rx="14" fill="#0f2740"/>
    <rect x="0" y="24" width="278" height="14" fill="#0f2740"/>
    <text class="t" x="18" y="25" fill="#ffffff" font-size="15" font-weight="700">Simulação da linha</text>
    <text class="t" x="18" y="66" fill="#8399ab" font-size="13">CENÁRIO ATUAL</text>
    <rect x="18" y="76" width="180" height="16" rx="8" fill="#e6edf4"/>
    <rect x="18" y="76" width="106" height="16" rx="8" fill="#ffb454"/>
    <text class="t" x="208" y="90" fill="#b3781a" font-size="15" font-weight="700">71%</text>
    <text class="t" x="18" y="122" fill="#8399ab" font-size="13">CENÁRIO SIMULADO</text>
    <rect x="18" y="132" width="180" height="16" rx="8" fill="#e6edf4"/>
    <rect x="18" y="132" width="158" height="16" rx="8" fill="url(#ac6)"/>
    <text class="t" x="208" y="146" fill="#1f6fd0" font-size="15" font-weight="700">90%</text>
    <text class="t" x="18" y="172" fill="#1f8f5f" font-size="14" font-weight="700">+19% de capacidade</text>
  </g>
</svg>

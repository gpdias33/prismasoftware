<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Tela de conversa de atendimento com agente de inteligência artificial">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#061120"/>
    </linearGradient>
    <linearGradient id="ac1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect width="800" height="480" fill="url(#bg1)"/>
  <circle cx="690" cy="70" r="150" fill="#208bf4" opacity=".08"/>
  <circle cx="90" cy="430" r="130" fill="#208bf4" opacity=".07"/>

  <!-- chat window -->
  <rect x="120" y="34" width="560" height="412" rx="22" fill="#132436" stroke="#208bf4" stroke-opacity=".3" stroke-width="2"/>

  <!-- header -->
  <path d="M120 56a22 22 0 0 1 22-22h516a22 22 0 0 1 22 22v58H120z" fill="#0f1e30"/>
  <line x1="120" y1="114" x2="680" y2="114" stroke="#208bf4" stroke-opacity=".2" stroke-width="2"/>
  <!-- robot avatar -->
  <g transform="translate(158,74)">
    <circle r="26" fill="url(#ac1)"/>
    <path d="M0-26v-9" stroke="#4aa8ff" stroke-width="3" stroke-linecap="round"/>
    <circle cy="-38" r="4" fill="#7fc4ff"/>
    <rect x="-14" y="-11" width="28" height="22" rx="7" fill="#0b1a2e"/>
    <circle cx="-6" cy="-2" r="3.5" fill="#7fc4ff"/>
    <circle cx="6" cy="-2" r="3.5" fill="#7fc4ff"/>
    <path d="M-6 6h12" stroke="#7fc4ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text class="t" x="198" y="70" fill="#ffffff" font-size="22" font-weight="600">Prisma IA · Atendimento</text>
  <circle cx="205" cy="90" r="6" fill="#39d98a"/>
  <text class="t" x="219" y="96" fill="#8fb6dd" font-size="17">Online 24 horas</text>

  <!-- customer message -->
  <g>
    <rect x="152" y="146" width="352" height="66" rx="16" fill="#1c3049"/>
    <path d="M158 206v20l24-20z" fill="#1c3049"/>
    <text class="t" x="176" y="176" fill="#dbe9f7" font-size="20">Oi! Qual o prazo de entrega</text>
    <text class="t" x="176" y="200" fill="#dbe9f7" font-size="20">do meu pedido?</text>
  </g>

  <!-- bot reply -->
  <g>
    <rect x="266" y="238" width="386" height="94" rx="16" fill="url(#ac1)"/>
    <path d="M646 326v22l-26-22z" fill="#1f6fd0"/>
    <text class="t" x="290" y="268" fill="#ffffff" font-size="20">Olá, Marina! O pedido #4821</text>
    <text class="t" x="290" y="294" fill="#ffffff" font-size="20">sai hoje e chega amanhã</text>
    <text class="t" x="290" y="320" fill="#ffffff" font-size="20">até às 18h. 📦</text>
  </g>

  <!-- quick replies -->
  <g class="t" font-size="17">
    <rect x="152" y="352" width="150" height="36" rx="18" fill="#0f1e30" stroke="#4aa8ff" stroke-opacity=".5"/>
    <text x="227" y="376" fill="#7fc4ff" text-anchor="middle">Rastrear pedido</text>
    <rect x="314" y="352" width="128" height="36" rx="18" fill="#0f1e30" stroke="#4aa8ff" stroke-opacity=".5"/>
    <text x="378" y="376" fill="#7fc4ff" text-anchor="middle">Falar com time</text>
  </g>

  <!-- input bar -->
  <g>
    <rect x="152" y="402" width="440" height="40" rx="20" fill="#0f1e30" stroke="#208bf4" stroke-opacity=".25"/>
    <text class="t" x="176" y="428" fill="#5f7f9e" font-size="18">Digite sua mensagem…</text>
    <circle cx="626" cy="422" r="22" fill="url(#ac1)"/>
    <path d="M616 422h18m-7-7 7 7-7 7" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

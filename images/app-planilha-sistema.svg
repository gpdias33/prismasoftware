<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-label="Comparação entre uma planilha cheia de erros e um sistema sob medida organizado">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#050f1d"/>
    </linearGradient>
    <linearGradient id="pac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','Consolas','Courier New',monospace}
    </style>
  </defs>

  <rect width="840" height="470" fill="url(#pbg)"/>
  <circle cx="700" cy="120" r="190" fill="#208bf4" opacity=".07"/>

  <!-- rótulos -->
  <text class="m" x="40" y="42" fill="#e05a5a" font-size="12" font-weight="700" letter-spacing="2">ANTES</text>
  <text class="m" x="470" y="42" fill="#3ddc97" font-size="12" font-weight="700" letter-spacing="2">DEPOIS</text>

  <!-- ============ planilha caótica ============ -->
  <g transform="translate(40,62)">
    <rect x="0" y="0" width="356" height="330" rx="10" fill="#f4f6f8" stroke="#d6dde5" stroke-width="2"/>
    <rect x="0" y="0" width="356" height="30" rx="10" fill="#1d6f42"/>
    <rect x="0" y="20" width="356" height="10" fill="#1d6f42"/>
    <text class="t" x="14" y="21" fill="#ffffff" font-size="12" font-weight="600">controle_final_v7_REVISADO(2).xlsx</text>

    <!-- cabeçalho de colunas -->
    <g class="m" font-size="9" fill="#6b7a89">
      <rect x="0" y="30" width="356" height="20" fill="#e6eaef"/>
      <text x="10" y="44">A</text><text x="76" y="44">B</text><text x="152" y="44">C</text>
      <text x="228" y="44">D</text><text x="300" y="44">E</text>
    </g>

    <!-- grade -->
    <g stroke="#dce2e9" stroke-width="1">
      <path d="M0 50h356M0 74h356M0 98h356M0 122h356M0 146h356M0 170h356M0 194h356M0 218h356M0 242h356M0 266h356M0 290h356M0 314h356"/>
      <path d="M68 30v300M144 30v300M220 30v300M292 30v300"/>
    </g>

    <!-- conteúdo -->
    <g class="m" font-size="9" fill="#4a5a6a">
      <text x="8" y="66">PED-1042</text><text x="76" y="66">Silva ME</text><text x="152" y="66">12/03</text><text x="228" y="66">R$ 4.200</text>
      <text x="8" y="90">PED-1043</text><text x="76" y="90">Souza</text><text x="152" y="90">13/03</text><text x="228" y="90">R$ 980</text>
      <text x="8" y="114">PED-1043</text><text x="76" y="114">Souza</text><text x="152" y="114">13/03</text><text x="228" y="114">R$ 980</text>
      <text x="8" y="138">ped 1044</text><text x="76" y="138">?</text><text x="152" y="138">14-03</text><text x="228" y="138">4300</text>
      <text x="8" y="162">PED-1045</text><text x="76" y="162">Lima SA</text><text x="152" y="162">15/03</text>
      <text x="8" y="186">PED-1046</text><text x="76" y="186">Costa</text><text x="152" y="186">16/03</text><text x="228" y="186">R$ 2.100</text>
      <text x="8" y="210">PED-1047</text><text x="76" y="210">Alves</text><text x="152" y="210">16/03</text><text x="228" y="210">R$ 1.500</text>
    </g>

    <!-- células com erro -->
    <rect x="1" y="99" width="290" height="23" fill="#e05a5a" opacity=".14"/>
    <rect x="221" y="147" width="70" height="23" fill="#f5a623" opacity=".22"/>
    <text class="m" x="228" y="162" font-size="9" fill="#b8860b" font-weight="700">#REF!</text>
    <rect x="145" y="123" width="74" height="23" fill="#f5a623" opacity=".22"/>

    <!-- balões de problema -->
    <g transform="translate(232,226)">
      <rect x="0" y="0" width="118" height="26" rx="6" fill="#fdecec" stroke="#e8b9b9"/>
      <text class="t" x="8" y="17" font-size="10" fill="#b03a3a" font-weight="600">linha duplicada</text>
    </g>
    <g transform="translate(232,258)">
      <rect x="0" y="0" width="118" height="26" rx="6" fill="#fdf3e3" stroke="#e8d3ab"/>
      <text class="t" x="8" y="17" font-size="10" fill="#946200" font-weight="600">quem alterou?</text>
    </g>
    <g transform="translate(232,290)">
      <rect x="0" y="0" width="118" height="26" rx="6" fill="#fdecec" stroke="#e8b9b9"/>
      <text class="t" x="8" y="17" font-size="10" fill="#b03a3a" font-weight="600">travou de novo</text>
    </g>
  </g>

  <!-- seta -->
  <g transform="translate(404,220)">
    <path d="M0 8h44" stroke="#4aa8ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 0l10 8-10 8" fill="none" stroke="#4aa8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ sistema sob medida ============ -->
  <g transform="translate(468,62)">
    <rect x="0" y="0" width="332" height="330" rx="10" fill="#0d1c2e" stroke="#2c4a6e" stroke-width="2"/>

    <!-- topo do app -->
    <rect x="0" y="0" width="332" height="38" rx="10" fill="#12233a"/>
    <rect x="0" y="28" width="332" height="10" fill="#12233a"/>
    <circle cx="20" cy="19" r="7" fill="url(#pac)"/>
    <text class="t" x="34" y="24" fill="#ffffff" font-size="11" font-weight="700">Portal de Pedidos</text>
    <rect x="250" y="10" width="68" height="18" rx="9" fill="#059652" opacity=".2"/>
    <circle cx="262" cy="19" r="3.5" fill="#3ddc97"/>
    <text class="m" x="270" y="23" fill="#3ddc97" font-size="8" font-weight="700">online</text>

    <!-- barra lateral -->
    <rect x="0" y="38" width="62" height="292" fill="#0a1727"/>
    <g fill="#4aa8ff" opacity=".9">
      <rect x="14" y="56" width="34" height="6" rx="3"/>
    </g>
    <g fill="#34557c">
      <rect x="14" y="78" width="34" height="6" rx="3"/>
      <rect x="14" y="98" width="28" height="6" rx="3"/>
      <rect x="14" y="118" width="32" height="6" rx="3"/>
      <rect x="14" y="138" width="24" height="6" rx="3"/>
    </g>

    <!-- KPIs -->
    <g transform="translate(76,52)">
      <rect x="0" y="0" width="76" height="52" rx="8" fill="#152a44"/>
      <text class="m" x="10" y="20" fill="#7f9bbd" font-size="8">EM ABERTO</text>
      <text class="t" x="10" y="40" fill="#ffffff" font-size="18" font-weight="800">37</text>
      <rect x="84" y="0" width="76" height="52" rx="8" fill="#152a44"/>
      <text class="m" x="94" y="20" fill="#7f9bbd" font-size="8">NO PRAZO</text>
      <text class="t" x="94" y="40" fill="#3ddc97" font-size="18" font-weight="800">94%</text>
      <rect x="168" y="0" width="76" height="52" rx="8" fill="#152a44"/>
      <text class="m" x="178" y="20" fill="#7f9bbd" font-size="8">FATURADO</text>
      <text class="t" x="178" y="40" fill="#ffffff" font-size="18" font-weight="800">R$ 84k</text>
    </g>

    <!-- gráfico -->
    <g transform="translate(76,120)">
      <rect x="0" y="0" width="244" height="92" rx="8" fill="#152a44"/>
      <polyline points="14,74 46,58 78,64 110,40 142,46 174,26 206,32 230,18"
                fill="none" stroke="#4aa8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 74l32-16 32 6 32-24 32 6 32-20 32 6 24-14V82H14z" fill="#4aa8ff" opacity=".13"/>
      <g fill="#4aa8ff"><circle cx="230" cy="18" r="3.5"/></g>
    </g>

    <!-- tabela limpa -->
    <g transform="translate(76,226)">
      <g class="m" font-size="8" fill="#6d89a8">
        <text x="4" y="10">PEDIDO</text><text x="76" y="10">CLIENTE</text><text x="164" y="10">STATUS</text>
      </g>
      <g class="m" font-size="9" fill="#cfe0f0">
        <rect x="0" y="18" width="244" height="22" rx="5" fill="#101f33"/>
        <text x="6" y="33">PED-1046</text><text x="78" y="33">Costa</text>
        <rect x="162" y="23" width="52" height="13" rx="6.5" fill="#059652" opacity=".25"/>
        <text x="168" y="33" fill="#3ddc97" font-size="8" font-weight="700">entregue</text>

        <rect x="0" y="46" width="244" height="22" rx="5" fill="#101f33"/>
        <text x="6" y="61">PED-1047</text><text x="78" y="61">Alves</text>
        <rect x="162" y="51" width="52" height="13" rx="6.5" fill="#4aa8ff" opacity=".22"/>
        <text x="168" y="61" fill="#7dc0ff" font-size="8" font-weight="700">em rota</text>

        <rect x="0" y="74" width="244" height="22" rx="5" fill="#101f33"/>
        <text x="6" y="89">PED-1048</text><text x="78" y="89">Lima SA</text>
        <rect x="162" y="79" width="52" height="13" rx="6.5" fill="#f5a623" opacity=".22"/>
        <text x="168" y="89" fill="#f5c06a" font-size="8" font-weight="700">separação</text>
      </g>
    </g>
  </g>

  <!-- legenda inferior -->
  <g class="t" transform="translate(40,410)">
    <rect x="0" y="0" width="356" height="40" rx="10" fill="#1a1010" stroke="#4a2626"/>
    <text x="16" y="25" fill="#e08b8b" font-size="12">Todo mundo edita. Ninguém confia no número.</text>
    <rect x="428" y="0" width="372" height="40" rx="10" fill="#0f2a1f" stroke="#1d5a3e"/>
    <text x="444" y="25" fill="#7fe0b4" font-size="12">Regra no sistema, histórico gravado, dado único.</text>
  </g>
</svg>

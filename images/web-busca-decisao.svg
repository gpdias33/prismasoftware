<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-label="Resultado de busca mostrando concorrentes com site e a empresa sem site aparecendo apenas como uma menção sem link">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#050f1d"/>
    </linearGradient>
    <linearGradient id="bac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
    <style>.t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
  </defs>

  <rect width="820" height="520" fill="url(#bbg)"/>
  <circle cx="700" cy="440" r="180" fill="#208bf4" opacity=".06"/>

  <!-- celular com a busca -->
  <g transform="translate(44,36)">
    <rect x="0" y="0" width="330" height="448" rx="30" fill="#0d1c2e" stroke="#31567c" stroke-width="3"/>
    <rect x="12" y="12" width="306" height="424" rx="22" fill="#ffffff"/>
    <rect x="128" y="20" width="74" height="12" rx="6" fill="#0d1c2e"/>

    <!-- campo de busca -->
    <g transform="translate(28,52)">
      <rect x="0" y="0" width="274" height="40" rx="20" fill="#f1f4f8" stroke="#dde4ec" stroke-width="1.5"/>
      <circle cx="26" cy="20" r="8" fill="none" stroke="#8ba0b5" stroke-width="2.5"/>
      <path d="M32 26l7 7" stroke="#8ba0b5" stroke-width="2.5" stroke-linecap="round"/>
      <text class="t" x="50" y="25" fill="#3c4d5e" font-size="13">marcenaria sob medida perto</text>
    </g>

    <!-- resultado 1 -->
    <g transform="translate(28,112)">
      <rect x="0" y="0" width="274" height="86" rx="10" fill="#f7fafd" stroke="#e3eaf2" stroke-width="1.5"/>
      <circle cx="20" cy="22" r="9" fill="url(#bac)"/>
      <text class="t" x="36" y="26" fill="#5a6b7c" font-size="10">marcenariaalfa.com.br</text>
      <text class="t" x="14" y="48" fill="#1a5fb4" font-size="14" font-weight="700">Marcenaria Alfa — Móveis sob medida</text>
      <text class="t" x="14" y="66" fill="#6b8299" font-size="10.5">Projeto 3D grátis, entrega em 30 dias. Veja</text>
      <text class="t" x="14" y="79" fill="#6b8299" font-size="10.5">fotos dos ambientes e peça um orçamento.</text>
      <g transform="translate(232,58)">
        <g fill="#f5a623"><path d="M0 0l2.4 4.9 5.4.8-3.9 3.8.9 5.4L0 12.3l-4.8 2.6.9-5.4L-7.8 5.7l5.4-.8z"/></g>
      </g>
    </g>

    <!-- resultado 2 -->
    <g transform="translate(28,210)">
      <rect x="0" y="0" width="274" height="86" rx="10" fill="#f7fafd" stroke="#e3eaf2" stroke-width="1.5"/>
      <circle cx="20" cy="22" r="9" fill="#3ddc97"/>
      <text class="t" x="36" y="26" fill="#5a6b7c" font-size="10">movelbeta.com.br</text>
      <text class="t" x="14" y="48" fill="#1a5fb4" font-size="14" font-weight="700">Móvel Beta — Orçamento online</text>
      <text class="t" x="14" y="66" fill="#6b8299" font-size="10.5">Atendimento por WhatsApp 24h. Mais de</text>
      <text class="t" x="14" y="79" fill="#6b8299" font-size="10.5">400 cozinhas entregues na região.</text>
    </g>

    <!-- resultado 3: a empresa sem site -->
    <g transform="translate(28,308)">
      <rect x="0" y="0" width="274" height="74" rx="10" fill="#fdf3f3" stroke="#f0d3d3" stroke-width="1.5" stroke-dasharray="6 5"/>
      <circle cx="20" cy="22" r="9" fill="#d9e1ea"/>
      <text class="t" x="36" y="26" fill="#a8b6c4" font-size="10">sem site — menção em lista</text>
      <text class="t" x="14" y="48" fill="#98a7b6" font-size="14" font-weight="700">Marcenaria do Carlos</text>
      <text class="t" x="14" y="65" fill="#b9c5d2" font-size="10.5">Sem informações. Sem fotos. Sem contato.</text>
    </g>

    <text class="t" x="165" y="410" text-anchor="middle" fill="#9aabbc" font-size="11">O cliente escolhe entre os dois primeiros.</text>
  </g>

  <!-- lado direito: o que o cliente avalia -->
  <g transform="translate(424,58)">
    <text class="t" x="0" y="0" fill="#ffffff" font-size="21" font-weight="800">Antes de ligar, ele já decidiu.</text>
    <text class="t" x="0" y="28" fill="#8ea7c0" font-size="14">A pesquisa acontece sem você saber. O que</text>
    <text class="t" x="0" y="50" fill="#8ea7c0" font-size="14">ela encontra é o que define a próxima etapa.</text>

    <g transform="translate(0,78)">
      <rect x="0" y="0" width="348" height="66" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="18" fill="#208bf4" opacity=".16"/>
      <path d="M28 33l6 7 12-14" stroke="#4aa8ff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="t" x="68" y="28" fill="#ffffff" font-size="14" font-weight="700">"Essa empresa existe mesmo?"</text>
      <text class="t" x="68" y="48" fill="#8ea7c0" font-size="12">Site próprio é o primeiro sinal de credibilidade.</text>
    </g>

    <g transform="translate(0,158)">
      <rect x="0" y="0" width="348" height="66" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="18" fill="#208bf4" opacity=".16"/>
      <path d="M28 33l6 7 12-14" stroke="#4aa8ff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="t" x="68" y="28" fill="#ffffff" font-size="14" font-weight="700">"Eles fazem o que eu preciso?"</text>
      <text class="t" x="68" y="48" fill="#8ea7c0" font-size="12">Serviços, fotos e preços respondem sem você.</text>
    </g>

    <g transform="translate(0,238)">
      <rect x="0" y="0" width="348" height="66" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="18" fill="#208bf4" opacity=".16"/>
      <path d="M28 33l6 7 12-14" stroke="#4aa8ff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="t" x="68" y="28" fill="#ffffff" font-size="14" font-weight="700">"Como falo com eles agora?"</text>
      <text class="t" x="68" y="48" fill="#8ea7c0" font-size="12">Um botão. Não um telefone que ninguém atende.</text>
    </g>

    <g transform="translate(0,324)">
      <rect x="0" y="0" width="348" height="58" rx="12" fill="#0f2a1f" stroke="#1d5a3e" stroke-width="1.5"/>
      <text class="t" x="20" y="25" fill="#3ddc97" font-size="13" font-weight="700">Quem responde essas três perguntas</text>
      <text class="t" x="20" y="44" fill="#9ad9bd" font-size="13" font-weight="700">primeiro, leva o cliente.</text>
    </g>
  </g>
</svg>

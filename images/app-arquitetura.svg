<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-label="Diagrama de arquitetura: navegador e aplicativo acessam uma API Django em Python, apoiada por PostgreSQL, Redis, Celery e serviços da AWS">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#050f1d"/>
    </linearGradient>
    <linearGradient id="aac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#3d6d9e"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','Consolas','Courier New',monospace}
      .lbl{font-size:11px;fill:#7f9bbd}
      .nm{font-size:13.5px;font-weight:700;fill:#ffffff}
      .sub{font-size:10px;fill:#8ea7c0}
    </style>
  </defs>

  <rect width="860" height="540" fill="url(#abg)"/>
  <circle cx="120" cy="80" r="170" fill="#208bf4" opacity=".06"/>
  <circle cx="760" cy="470" r="170" fill="#208bf4" opacity=".05"/>

  <!-- grade de fundo -->
  <g stroke="#1a3050" stroke-width="1" opacity=".5">
    <path d="M0 40h860M0 140h860M0 240h860M0 340h860M0 440h860"/>
  </g>

  <!-- ===== camada 1: clientes ===== -->
  <text class="m" x="40" y="36" fill="#4aa8ff" font-size="10" letter-spacing="2">01 · QUEM USA</text>
  <g transform="translate(40,52)">
    <rect x="0" y="0" width="172" height="66" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <rect x="18" y="20" width="30" height="24" rx="3" fill="none" stroke="#4aa8ff" stroke-width="2"/>
    <path d="M18 27h30" stroke="#4aa8ff" stroke-width="2"/>
    <text class="t nm" x="62" y="32">Navegador</text>
    <text class="t sub" x="62" y="48">equipe interna e clientes</text>
  </g>
  <g transform="translate(232,52)">
    <rect x="0" y="0" width="172" height="66" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <rect x="22" y="16" width="22" height="34" rx="4" fill="none" stroke="#4aa8ff" stroke-width="2"/>
    <path d="M30 45h6" stroke="#4aa8ff" stroke-width="2" stroke-linecap="round"/>
    <text class="t nm" x="60" y="32">App no celular</text>
    <text class="t sub" x="60" y="48">campo, vendas, entrega</text>
  </g>
  <g transform="translate(424,52)">
    <rect x="0" y="0" width="196" height="66" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <circle cx="34" cy="33" r="14" fill="none" stroke="#4aa8ff" stroke-width="2"/>
    <path d="M20 33h28M34 19c7 8 7 20 0 28M34 19c-7 8-7 20 0 28" stroke="#4aa8ff" stroke-width="1.6" fill="none"/>
    <text class="t nm" x="60" y="32">ERP / CRM já existente</text>
    <text class="t sub" x="60" y="48">integração por API</text>
  </g>

  <!-- setas para a API -->
  <g stroke="#3d6d9e" stroke-width="2" fill="none" marker-end="url(#arw)">
    <path d="M126 122v44"/>
    <path d="M318 122q0 26-40 32"/>
    <path d="M522 122q0 30-120 40"/>
  </g>

  <!-- ===== camada 2: aplicação ===== -->
  <text class="m" x="40" y="164" fill="#4aa8ff" font-size="10" letter-spacing="2">02 · APLICAÇÃO</text>
  <g transform="translate(40,178)">
    <rect x="0" y="0" width="580" height="104" rx="14" fill="#122744" stroke="#3a6ea5" stroke-width="2"/>
    <rect x="0" y="0" width="580" height="104" rx="14" fill="url(#aac)" opacity=".07"/>

    <g transform="translate(22,22)">
      <rect x="0" y="0" width="150" height="60" rx="10" fill="#0d1c2e" stroke="#2c4a6e"/>
      <text class="t nm" x="14" y="26">Django</text>
      <text class="m sub" x="14" y="44">Python · API REST</text>
    </g>
    <g transform="translate(186,22)">
      <rect x="0" y="0" width="150" height="60" rx="10" fill="#0d1c2e" stroke="#2c4a6e"/>
      <text class="t nm" x="14" y="26">Java / Spring</text>
      <text class="m sub" x="14" y="44">serviços críticos</text>
    </g>
    <g transform="translate(350,22)">
      <rect x="0" y="0" width="208" height="60" rx="10" fill="#0d1c2e" stroke="#2c4a6e"/>
      <text class="t nm" x="14" y="26">Autenticação e permissões</text>
      <text class="m sub" x="14" y="44">perfis, trilha de auditoria</text>
    </g>
  </g>

  <!-- fila assíncrona -->
  <g transform="translate(652,178)">
    <rect x="0" y="0" width="168" height="104" rx="14" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <text class="m" x="16" y="24" fill="#4aa8ff" font-size="10" letter-spacing="1.5">ASSÍNCRONO</text>
    <text class="t nm" x="16" y="48">Celery + Redis</text>
    <text class="t sub" x="16" y="66">relatórios pesados,</text>
    <text class="t sub" x="16" y="80">e-mails, importações</text>
    <text class="t sub" x="16" y="94">sem travar a tela</text>
  </g>
  <g stroke="#3d6d9e" stroke-width="2" fill="none" marker-end="url(#arw)">
    <path d="M622 220h22"/>
  </g>
  <g stroke="#3d6d9e" stroke-width="2" fill="none" marker-end="url(#arw)" opacity=".6">
    <path d="M644 252h-22"/>
  </g>

  <!-- setas para dados -->
  <g stroke="#3d6d9e" stroke-width="2" fill="none" marker-end="url(#arw)">
    <path d="M140 286v44"/>
    <path d="M400 286v44"/>
  </g>

  <!-- ===== camada 3: dados ===== -->
  <text class="m" x="40" y="328" fill="#4aa8ff" font-size="10" letter-spacing="2">03 · DADOS</text>
  <g transform="translate(40,342)">
    <rect x="0" y="0" width="240" height="94" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <g transform="translate(20,22)">
      <ellipse cx="22" cy="10" rx="22" ry="8" fill="none" stroke="#4aa8ff" stroke-width="2"/>
      <path d="M0 10v30c0 4.4 9.8 8 22 8s22-3.6 22-8V10" fill="none" stroke="#4aa8ff" stroke-width="2"/>
      <path d="M0 25c0 4.4 9.8 8 22 8s22-3.6 22-8" fill="none" stroke="#4aa8ff" stroke-width="2" opacity=".6"/>
    </g>
    <text class="t nm" x="86" y="40">PostgreSQL</text>
    <text class="t sub" x="86" y="58">a fonte única da verdade,</text>
    <text class="t sub" x="86" y="74">com backup automático</text>
  </g>

  <g transform="translate(300,342)">
    <rect x="0" y="0" width="240" height="94" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <g transform="translate(22,30)">
      <path d="M22 0l22 12-22 12L0 12z" fill="none" stroke="#4aa8ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 24l22 12 22-12" fill="none" stroke="#4aa8ff" stroke-width="2" stroke-linejoin="round" opacity=".6"/>
    </g>
    <text class="t nm" x="86" y="40">Redis</text>
    <text class="t sub" x="86" y="58">cache e fila — a tela abre</text>
    <text class="t sub" x="86" y="74">em milissegundos</text>
  </g>

  <g transform="translate(560,342)">
    <rect x="0" y="0" width="260" height="94" rx="12" fill="#101f33" stroke="#2c4a6e" stroke-width="1.5"/>
    <g transform="translate(22,34)">
      <path d="M4 20a12 12 0 0 1 3-23 16 16 0 0 1 30 4 10 10 0 0 1-2 19z" fill="none" stroke="#4aa8ff" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text class="t nm" x="90" y="40">AWS</text>
    <text class="t sub" x="90" y="58">servidores, armazenamento</text>
    <text class="t sub" x="90" y="74">e escala sob demanda</text>
  </g>

  <!-- ===== rodapé: garantias ===== -->
  <g transform="translate(40,466)">
    <rect x="0" y="0" width="780" height="46" rx="12" fill="#0f2a1f" stroke="#1d5a3e" stroke-width="1.5"/>
    <g transform="translate(20,12)">
      <circle cx="11" cy="11" r="11" fill="#3ddc97" opacity=".18"/>
      <path d="M6 11l4 4 7-8" stroke="#3ddc97" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="t" x="54" y="29" fill="#9ee3c2" font-size="12.5">HTTPS em tudo · backup diário testado · registro de quem fez o quê · deploy automatizado com rollback</text>
  </g>
</svg>
